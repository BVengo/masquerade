name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            experimental: false
          - python-version: "3.11"
            experimental: false
          - python-version: "3.12"
            experimental: false
          - python-version: "3.13"
            experimental: false
          - python-version: "3.14"
            experimental: false
          - python-version: "3.15"
            experimental: true

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.4"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync test dependencies
        run: uv sync --group test --frozen

      - name: Test
        run: uv run --frozen --no-sync pytest

  package:
    name: Lint and package
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.4"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync all dependencies
        run: uv sync --all-groups --frozen

      - name: Lint
        run: |
          uv run --frozen --no-sync ruff check --output-format=github .
          uv run --frozen --no-sync ruff format --check .

      - name: Build distributions
        run: uv build

      - name: Validate distribution metadata
        run: uv run --frozen --no-sync twine check dist/*

      - name: Smoke-test built wheel
        run: |
          uv venv --python 3.14 /tmp/masquerade-wheel
          uv pip install --python /tmp/masquerade-wheel/bin/python dist/*.whl
          /tmp/masquerade-wheel/bin/python -c "import masquerade"
