[project]
name = "masquerade"
version = "0.1.0"
description = "A library for checking and preventing file-spoofing attacks."
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/BVengo/masquerade"
Issues = "https://github.com/BVengo/masquerade/issues"
Funding = "https://ko-fi.com/bvengo"

[dependency-groups]
dev = [
    "pyright>=1.1.404",
    "ruff>=0.16.3",
    "twine>=7.0.0",
]
test = [
    "pytest>=9.1.1",
]

[project.scripts]
masquerade = "masquerade:main"

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "bindings/python/Cargo.toml"
module-name = "masquerade._native"
python-source = "bindings/python/python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["bindings/python/tests"]

[tool.pyright]
include = ["bindings/python/typecheck"]
extraPaths = ["bindings/python/python"]
pythonVersion = "3.10"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py310"
line-length = 79

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # Conflicts with the formatter.
    "CPY001", # The project-level LICENSE.md is the copyright notice.
    "D203",   # Incompatible with D211.
    "D213",   # Incompatible with D212.
    "EM101",  # Local exception messages are clearer than module constants.
    "EM102",  # Local exception messages are clearer than module constants.
    "ISC001", # Conflicts with the formatter.
    "PLR2004", # Binary format specifications use meaningful numeric constants.
    "TRY003", # Built-in parse errors do not need custom exception classes.
]

[tool.ruff.lint.per-file-ignores]
"bindings/python/tests/**" = ["INP001", "S101"] # Tests are not a package and use pytest asserts.
"bindings/python/typecheck/**" = ["INP001"] # Static fixtures are not a package.
